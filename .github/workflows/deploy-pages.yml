name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:   # allows manual trigger from the Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skip runs queued between the run in-progress and latest queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install nasm -y

      - name: Build v86
        run: make all

      # Assemble everything the demo page needs into _site/
      - name: Prepare site directory
        run: |
          mkdir -p _site/build
          mkdir -p _site/bios
          mkdir -p _site/lib

          # Main demo page and assets
          cp index.html          _site/
          cp v86.css             _site/
          cp debug.html          _site/ 2>/dev/null || true
          cp manifest.json       _site/ 2>/dev/null || true
          cp 192.png             _site/ 2>/dev/null || true
          cp favicon.ico         _site/ 2>/dev/null || true

          # Built JS and WASM
          cp build/v86_all.js    _site/build/
          cp build/v86.wasm      _site/build/
          cp build/v86_all.js.map _site/build/ 2>/dev/null || true

          # BIOS files (shipped in the repo)
          cp bios/*              _site/bios/

          # Library files (9p filesystem support etc.)
          cp lib/*               _site/lib/ 2>/dev/null || true

          # Prevent Jekyll processing (important for files starting with _)
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
